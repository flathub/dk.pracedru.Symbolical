id: dk.pracedru.Symbolical
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: symbolical
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --env=QT_AUDIO_BACKEND=pulseaudio
  - --socket=cups
  - --env=QT_SCALE_FACTOR_ROUNDING_POLICY=Round
  - --system-talk-name=org.freedesktop.Accounts
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
modules:
  - patchelf.json
  - python3-python-dateutil.json
  - python3-meson-python.json
  - python3-dbus-python.json
  - name: symbolical
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.com/symbolical/symbolical.git
        commit: d43f49f352e6ab4a613a84e54aec0cf7664d79b0
        tag: v0.6.5.1
