id: dk.pracedru.Symbolical
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: symbolical
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=cups
  - --socket=pulseaudio
  - --env=QT_AUDIO_BACKEND=pulseaudio
  - --env=QT_SCALE_FACTOR_ROUNDING_POLICY=Round
  - --system-talk-name=org.freedesktop.Accounts
  - --filesystem=xdg-templates
  - --filesystem=xdg-documents
  - --share=network
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
modules:
  - name: openblas
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DDYNAMIC_ARCH=ON
    build-options:
      arch:
        x86_64:
          config-opts:
            - -DTARGET=GENERIC
        aarch64:
          config-opts:
            - -DTARGET=ARMV8
    sources:
      - type: archive
        url: https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.34/OpenBLAS-0.3.34.tar.gz
        sha256: cd7e129868320cc2d033afa920e31202dfe0b8066a5b66661900ccc0f197dfed
  - python3-meson-python.json
  - python3-patchelf.json
  - python3-python-dateutil.json
  - python3-pythran.json
  - python3-pybind11.json
  - python3-sympy.json
  - python3-numpy.json
  - python3-scipy.json  
  - python3-pint.json
  - python3-fonttools.json
  - python3-openpyxl.json
  - name: symbolical
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.com/symbolical/symbolical.git
        commit: 6a187dfa3902a9d37fbd8afdd3cce26dcec6e338
        tag: v0.9.0.1

