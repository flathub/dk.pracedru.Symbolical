id: dk.pracedru.Symbolical
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: symbolical
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=cups
  - --socket=pulseaudio
  - --env=QT_AUDIO_BACKEND=pulseaudio
  - --env=QT_SCALE_FACTOR_ROUNDING_POLICY=Round
  - --system-talk-name=org.freedesktop.Accounts
  - --filesystem=xdg-templates
  - --filesystem=xdg-documents
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
modules:
  - python3-python-dateutil.json
  - name: symbolical
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.com/symbolical/symbolical.git
        commit: efa79bfd4d11ba620e97cc35cc8b8260e2a69d10
        tag: v0.7.0.0
